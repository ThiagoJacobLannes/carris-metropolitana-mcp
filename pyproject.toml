[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carris-metropolitana-mcp"
version = "0.1.1"
description = "DEPRECATED: now part of portugal-mcp. MCP server for real-time Carris Metropolitana bus info (Greater Lisbon) from the official open API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ThiagoJacobLannes/carris-metropolitana-mcp"

[project.scripts]
carris-metropolitana-mcp = "carris_metropolitana_mcp.server:main"

[tool.setuptools]
packages = ["carris_metropolitana_mcp"]
